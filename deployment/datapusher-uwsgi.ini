[uwsgi]

http            =  0.0.0.0:8800
uid             =  www-data
guid            =  www-data
wsgi-file       =  /var/www/datapusher/deployment/datapusher.wsgi
master          =  true
processes       =  2
threads         =  2
pidfile         =  /tmp/%n.pid
harakiri        =  50
max-requests    =  5000
vacuum          =  true
callable        =  application
buffer-size     =  32768

## see High Availability Setup
workers         =  3
#threads         =  3
lazy-apps       =  true
